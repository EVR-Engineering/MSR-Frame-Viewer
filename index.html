<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MSR Frame Deflection Viewer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e5e7eb}
.top{padding:14px 18px;background:#192130;border-bottom:1px solid #374151;display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:20px;margin:0 0 3px}.subtitle{font-size:12px;color:#9ca3af}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upload{background:#2563eb;color:white;border:1px solid #60a5fa;border-radius:6px;padding:9px 15px;font-size:13px;cursor:pointer;font-weight:600}
.upload:focus-within{outline:2px solid #93c5fd}.upload input{position:absolute;opacity:0;width:1px;height:1px}
button{background:#334155;color:white;padding:9px 12px;border:1px solid #64748b;border-radius:6px;cursor:pointer}
#status{font-size:12px;color:#a7f3d0}#status.error{color:#fca5a5}
#errors{padding:12px 18px;white-space:pre-wrap;line-height:1.5;color:#fca5a5;display:none;background:#3b1722}
#errors.show{display:block}
#viewer{display:block;width:100%;height:calc(100vh - 87px);min-height:600px;border:0;background:#111827}
@media(max-width:760px){#viewer{height:calc(100vh - 140px)}h1{font-size:17px}}
</style>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<header class="top">
 <div><h1>Frame Deflection Viewer</h1><div class="subtitle">GitHub Pages edition · Data processed locally in your browser</div></div>
 <div class="actions">
  <label class="upload">Load Excel workbook <input id="file" type="file" accept=".xlsx,.xlsm" /></label>
  <button id="demo" type="button">Restore demo</button>
  <span id="status" role="status">Loading demo…</span>
 </div>
</header>
<div id="errors" role="alert"></div>
<iframe id="viewer" title="Interactive 3D frame deflection viewer" allow="fullscreen"></iframe>
</body>
</html>
